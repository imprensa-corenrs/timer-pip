<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-app-region: no-drag;  /* raiz SEM drag — libera as bordas para o Windows redimensionar */
  }

  :root {
    --green: #00e5a0; --yellow: #f5c518; --orange: #ff7b00; --red: #ff2d55;
    --muted: #cfcfe0;
  }

  body {
    font-family: 'Oswald', sans-serif;
    position: relative;
    height: 100vh; width: 100vw;
  }

  /* Camada de arraste: cobre tudo MENOS uma faixa de 10px nas bordas,
     que fica livre para o cursor de redimensionar do Windows aparecer. */
  .drag-layer {
    position: absolute;
    inset: 10px;
    -webkit-app-region: drag;
    cursor: move;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    pointer-events: none;   /* clique passa direto para a drag-layer abaixo */
  }

  .encerrar {
    display: none;
    font-family: 'Share Tech Mono', monospace;
    font-weight: 700;
    font-size: clamp(20px, 11vw, 46px);
    letter-spacing: clamp(3px, 1.5vw, 9px);
    color: var(--red);
    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 24px rgba(255,45,85,1);
    text-transform: uppercase;
  }
  .encerrar.show { display: block; }

  .time {
    font-weight: 700;
    font-size: clamp(38px, 20vw, 96px);
    line-height: 1;
    letter-spacing: -1px;
    color: var(--green);
    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(0,229,160,.7);
    font-variant-numeric: tabular-nums;
  }
  .time.yellow { color: var(--yellow); text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(245,197,24,.7); }
  .time.orange { color: var(--orange); text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(255,123,0,.7); }
  .time.red    { color: var(--red);    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(255,45,85,.8); }
  body.overtime .time {
    font-size: clamp(16px, 7vw, 26px);
    opacity: .9;
  }

  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(8px, 3.2vw, 12px);
    letter-spacing: clamp(2px, 1vw, 4px);
    color: var(--muted);
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
    text-align: center;
  }
  body.overtime .label { display: none; }

  .hint {
    position: absolute;
    bottom: 2px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.35);
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    opacity: 0;
    transition: opacity .2s;
    z-index: 3;
    pointer-events: none;
  }
  body:hover .hint { opacity: 1; }
</style>
</head>
<body>
  <div class="drag-layer"></div>
  <div class="content">
    <div class="encerrar" id="encerrar">ENCERRAR</div>
    <div class="time" id="time">00:00</div>
    <div class="label" id="label">AGUARDANDO</div>
  </div>
  <div class="hint">arraste pelo centro · borda redimensiona · 2x clique fecha</div>

<script>
  const { ipcRenderer } = require('electron');

  const timeEl     = document.getElementById('time');
  const labelEl    = document.getElementById('label');
  const encerrarEl = document.getElementById('encerrar');

  let overtimeActive = false;
  let blinkRAF = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatTime(secs) {
    const neg = secs < 0;
    const abs = Math.abs(secs);
    const h = Math.floor(abs / 3600);
    const m = Math.floor((abs % 3600) / 60);
    const s = abs % 60;
    return `${neg ? '-' : ''}${h > 0 ? pad(h) + ':' : ''}${pad(m)}:${pad(s)}`;
  }

  // Pisca ENCERRAR + timer negativo juntos, com o MESMO valor de opacidade,
  // calculado a partir de um único relógio — garante sincronia perfeita
  // (diferente de duas animações CSS que começam em momentos diferentes).
  function startSyncBlink() {
    if (blinkRAF) return;
    const period = 1600; // ms, mesmo ritmo de antes
    function frame() {
      const t = Date.now() % period;
      const phase = (t / period) * Math.PI * 2;
      const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(phase));
      timeEl.style.opacity = alpha;
      encerrarEl.style.opacity = alpha;
      blinkRAF = requestAnimationFrame(frame);
    }
    frame();
  }

  function stopSyncBlink() {
    if (blinkRAF) { cancelAnimationFrame(blinkRAF); blinkRAF = null; }
    timeEl.style.opacity = '';
    encerrarEl.style.opacity = '';
  }

  ipcRenderer.on('timer-state', (_event, state) => {
    const { remainingSeconds, totalSeconds, running, started } = state;
    const overtime = started && totalSeconds > 0 && remainingSeconds <= 0;

    timeEl.textContent = formatTime(remainingSeconds);
    timeEl.className = 'time';
    document.body.classList.toggle('overtime', overtime);

    if (overtime) {
      timeEl.classList.add('red');
      encerrarEl.classList.add('show');
      if (!overtimeActive) { overtimeActive = true; startSyncBlink(); }
    } else {
      encerrarEl.classList.remove('show');
      if (overtimeActive) { overtimeActive = false; stopSyncBlink(); }

      if (remainingSeconds <= 60) { timeEl.classList.add('red'); labelEl.textContent = 'ÚLTIMO MINUTO'; }
      else if (remainingSeconds <= 120) { timeEl.classList.add('orange'); labelEl.textContent = '2 MIN RESTANTES'; }
      else if (remainingSeconds <= 300) { timeEl.classList.add('yellow'); labelEl.textContent = '5 MIN RESTANTES'; }
      else { labelEl.textContent = !started ? 'AGUARDANDO' : running ? 'EM ANDAMENTO' : 'PAUSADO'; }
    }
  });

  // Fechar com duplo clique ou Esc
  document.addEventListener('dblclick', () => ipcRenderer.send('overlay-request-close'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ipcRenderer.send('overlay-request-close');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;   /* fundo 100% transparente, nativo do SO */
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-app-region: drag;  /* permite arrastar a janela clicando em qualquer lugar */
    cursor: move;
  }

  :root {
    --green: #00e5a0; --yellow: #f5c518; --orange: #ff7b00; --red: #ff2d55;
    --muted: #cfcfe0;
  }

  body {
    font-family: 'Oswald', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; width: 100vw;
    gap: 4px;
  }

  @keyframes blink-slow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .encerrar {
    display: none;
    font-family: 'Share Tech Mono', monospace;
    font-weight: 700;
    font-size: clamp(20px, 11vw, 46px);
    letter-spacing: clamp(3px, 1.5vw, 9px);
    color: var(--red);
    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 24px rgba(255,45,85,1);
    text-transform: uppercase;
    animation: blink-slow 1.6s ease-in-out infinite;
  }
  .encerrar.show { display: block; }

  .time {
    font-weight: 700;
    font-size: clamp(38px, 20vw, 96px);
    line-height: 1;
    letter-spacing: -1px;
    color: var(--green);
    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(0,229,160,.7);
    font-variant-numeric: tabular-nums;
  }
  .time.yellow { color: var(--yellow); text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(245,197,24,.7); }
  .time.orange { color: var(--orange); text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(255,123,0,.7); }
  .time.red    { color: var(--red);    text-shadow: 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(255,45,85,.8); animation: blink-slow 1.6s ease-in-out infinite; }
  body.overtime .time {
    font-size: clamp(16px, 7vw, 26px);
    opacity: .9;
  }

  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(8px, 3.2vw, 12px);
    letter-spacing: clamp(2px, 1vw, 4px);
    color: var(--muted);
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
    text-align: center;
  }
  body.overtime .label { display: none; }

  .hint {
    position: absolute;
    bottom: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.35);
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    opacity: 0;
    transition: opacity .2s;
  }
  body:hover .hint { opacity: 1; }
</style>
</head>
<body>
  <div class="encerrar" id="encerrar">ENCERRAR</div>
  <div class="time" id="time">00:00</div>
  <div class="label" id="label">AGUARDANDO</div>
  <div class="hint">2x clique para fechar</div>

<script>
  const { ipcRenderer } = require('electron');

  const timeEl     = document.getElementById('time');
  const labelEl    = document.getElementById('label');
  const encerrarEl = document.getElementById('encerrar');

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatTime(secs) {
    const neg = secs < 0;
    const abs = Math.abs(secs);
    const h = Math.floor(abs / 3600);
    const m = Math.floor((abs % 3600) / 60);
    const s = abs % 60;
    return `${neg ? '-' : ''}${h > 0 ? pad(h) + ':' : ''}${pad(m)}:${pad(s)}`;
  }

  ipcRenderer.on('timer-state', (_event, state) => {
    const { remainingSeconds, totalSeconds, running, started } = state;
    const overtime = started && totalSeconds > 0 && remainingSeconds <= 0;

    timeEl.textContent = formatTime(remainingSeconds);
    timeEl.className = 'time';
    document.body.classList.toggle('overtime', overtime);

    if (overtime) {
      timeEl.classList.add('red');
      encerrarEl.classList.add('show');
    } else {
      encerrarEl.classList.remove('show');
      if (remainingSeconds <= 60) { timeEl.classList.add('red'); labelEl.textContent = 'ÚLTIMO MINUTO'; }
      else if (remainingSeconds <= 120) { timeEl.classList.add('orange'); labelEl.textContent = '2 MIN RESTANTES'; }
      else if (remainingSeconds <= 300) { timeEl.classList.add('yellow'); labelEl.textContent = '5 MIN RESTANTES'; }
      else { labelEl.textContent = !started ? 'AGUARDANDO' : running ? 'EM ANDAMENTO' : 'PAUSADO'; }
    }
  });

  // Fechar com duplo clique ou Esc
  document.addEventListener('dblclick', () => ipcRenderer.send('overlay-request-close'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ipcRenderer.send('overlay-request-close');
  });
</script>
</body>
</html>
